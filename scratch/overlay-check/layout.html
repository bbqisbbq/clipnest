<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>body{margin:0;height:700px} .app{height:100%} .workspace{display:grid;grid-template-columns:218px minmax(0,1fr);height:100%}</style>
</head><body class="app is-memos"><div class="workspace"><div></div>
<div class="memos" style="height:100%">
  <div class="memo-main"><div class="memo-head"><input class="input" value="x"></div><div class="memo-timeline"></div></div>
  <div class="memo-splitter" id="sp"></div>
  <div class="memo-editor" id="ed" style="width:380px">
    <div class="md-live" id="live">
      <div id="back" class="input is-area memo-input md-live-back"><div class="md-line">hello #tag</div></div>
      <textarea id="front" class="input is-area memo-input md-live-front">hello #tag</textarea>
    </div>
    <div class="memo-editor-foot"><span class="snip-hint">#tag</span></div>
  </div>
</div></div>
<pre id="out">pending</pre>
<script>
const sp = document.getElementById("sp"), ed = document.getElementById("ed"), live = document.getElementById("live");
const cs = (el, p) => getComputedStyle(el)[p];
const front = document.getElementById("front"), back = document.getElementById("back");
const props = ["fontSize","lineHeight","fontFamily","letterSpacing","paddingLeft","paddingTop","width"];
const diff = {};
for (const p of props) if (cs(front,p) !== cs(back,p)) diff[p] = [cs(front,p), cs(back,p)];
// 模拟往右拖 60px：编辑器应变窄 60
ed.style.width = "320px";
const after = { editorW: Math.round(ed.getBoundingClientRect().width), frontW: Math.round(front.getBoundingClientRect().width), backW: Math.round(back.getBoundingClientRect().width) };
document.getElementById("out").textContent = JSON.stringify({
  splitterCursor: cs(sp,"cursor"),
  splitterWidth: Math.round(sp.getBoundingClientRect().width),
  editableResize: cs(live,"resize"),
  textareaResize: cs(front,"resize"),
  metricDiff: diff,
  afterDrag: after,
}, null, 2);
</script></body></html>
